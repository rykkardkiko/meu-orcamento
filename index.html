
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Orçamento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#24342c;font-family:Arial,sans-serif}
header{background:#173d35;color:white;padding:24px}
main{max-width:850px;margin:auto;padding:18px}
h1{margin:0 0 6px}h2{font-size:19px}
.panel,.card{background:white;padding:18px;border-radius:14px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card span{font-size:13px;color:#697670}
.card strong{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
input,select,button{width:100%;padding:12px;border-radius:8px;font:inherit}
input,select{border:1px solid #ccd6d0;background:white}
button{background:#173d35;color:white;border:0;cursor:pointer;margin-top:12px}
.secondary{background:#e7f3ed;color:#173d35}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border-bottom:1px solid #e1e7e3;padding:12px 0;overflow-wrap:anywhere}
.small{font-size:12px;color:#697670}
.income{color:#24804f}.expense{color:#b94343}
.hidden{display:none}
#status{white-space:pre-wrap;font-size:14px}
@media(max-width:560px){.cards{grid-template-columns:1fr}.card{padding:13px}.row{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>Meu Orçamento</h1>
  <div>O teu orçamento pessoal, sincronizado na nuvem.</div>
</header>
<main>
  <section class="panel" id="login">
    <h2>Aceder à minha conta</h2>
    <p class="small">Cria uma conta ou inicia sessão com o teu email.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Palavra-passe</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <button id="signin">Iniciar sessão</button>
    <button id="signup" class="secondary">Criar conta</button>
    <p id="auth-status" role="status"></p>
  </section>

  <section id="app" class="hidden">
    <section class="panel">
      <div id="account" class="small"></div>
      <button id="logout" class="secondary">Terminar sessão</button>
      <label for="month">Resumo mensal</label>
      <input id="month" type="month">
    </section>

    <section class="cards">
      <div class="card"><span>Rendimentos</span><strong id="income" class="income">0,00 €</strong></div>
      <div class="card"><span>Despesas</span><strong id="expenses" class="expense">0,00 €</strong></div>
      <div class="card"><span>Saldo</span><strong id="balance">0,00 €</strong></div>
    </section>

    <section class="panel">
      <h2>Novo movimento</h2>
      <form id="movement-form">
        <div class="row">
          <div>
            <label for="type">Tipo</label>
            <select id="type"><option>Despesa</option><option>Rendimento</option></select>
          </div>
          <div>
            <label for="date">Data</label>
            <input id="date" type="date" required>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="category">Categoria</label>
            <select id="category">
              <option>Casa</option><option>Alimentação</option>
              <option>Carro</option><option>Combustível</option>
              <option>Transportes</option><option>Saúde</option>
              <option>Educação</option><option>Ginásio</option>
              <option>Telecomunicações</option><option>Seguros</option>
              <option>Lazer</option><option>Salário</option>
              <option>Subsídios</option><option>Outros</option>
            </select>
          </div>
          <div>
            <label for="amount">Valor (€)</label>
            <input id="amount" type="number" min="0.01" step="0.01" required>
          </div>
        </div>
        <label for="description">Descrição</label>
        <input id="description" maxlength="120" placeholder="Ex.: supermercado">
        <button id="save" type="submit">Guardar movimento</button>
      </form>
      <p id="status" role="status"></p>
    </section>

    <section class="panel">
      <h2>Movimentos do mês</h2>
      <div id="list"></div>
      <button id="refresh" class="secondary">Atualizar movimentos</button>
    </section>
  </section>
</main>

<script>
const PROJECT_URL = "https://bvmudqebxgotujxbvhyg.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_ET7W3dDaX8N68wqZ0DHMQQ_pbZWk-g1";

const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString("pt-PT", {
  style:"currency", currency:"EUR"
});
const now = new Date();
const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
$("month").value = today.slice(0,7);
$("date").value = today;

let db = null;
let currentUser = null;
let movements = [];

function message(id, text) { $(id).textContent = text; }

function configurationOK() {
  return PROJECT_URL.startsWith("https://") &&
    !PROJECT_URL.includes("COLOCA_AQUI") &&
    PUBLISHABLE_KEY.length > 20 &&
    !PUBLISHABLE_KEY.includes("COLOCA_AQUI");
}

async function init() {
  if (!configurationOK()) {
    message("auth-status", "Falta preencher PROJECT_URL e PUBLISHABLE_KEY no código.");
    return;
  }
  if (!window.supabase) {
    message("auth-status", "Não foi possível carregar a biblioteca. Verifica a ligação à Internet.");
    return;
  }
 
db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true,
    storage: window.localStorage
  }
});
  const {data, error} = await db.auth.getSession();
  if (error) message("auth-status", error.message);
  if (data?.session) await showApp(data.session.user);
}

async function signIn(signUp) {
  if (!db) {
    message("auth-status", "Configura primeiro o URL e a chave pública.");
    return;
  }
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 8) {
    message("auth-status", "Indica um email válido e uma palavra-passe com pelo menos 8 caracteres.");
    return;
  }
  $("signin").disabled = $("signup").disabled = true;
  message("auth-status", "A processar...");
  try {
    const result = signUp
      ? await db.auth.signUp({email,password})
      : await db.auth.signInWithPassword({email,password});
    if (result.error) throw result.error;
    if (signUp && !result.data.session) {
      message("auth-status", "Conta criada. Confirma o email recebido e depois inicia sessão.");
    } else if (result.data.user) {
      await showApp(result.data.user);
      message("auth-status", "");
    }
  } catch (e) {
    message("auth-status", "Não foi possível autenticar: " + e.message);
  } finally {
    $("signin").disabled = $("signup").disabled = false;
  }
}

async function showApp(user) {
  currentUser = user;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  message("account", "Sessão iniciada: " + user.email);
  await loadMovements();
}

async function loadMovements() {
  if (!currentUser) return;
  message("status", "A carregar movimentos...");
  const month = $("month").value;
  const start = month + "-01";
  const d = new Date(Number(month.slice(0,4)), Number(month.slice(5,7)), 1);
  const end = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;

  const {data,error} = await db.from("movimentos")
    .select("id,user_id,data,tipo,categoria,descricao,valor")
    .gte("data",start).lt("data",end)
    .order("data",{ascending:false});

  if (error) {
    movements = [];
    render();
    message("status", "Erro ao carregar: " + error.message);
    return;
  }
  movements = data || [];
  render();
  message("status", "");
}

function render() {
  const income = movements.filter(m => m.tipo === "Rendimento")
    .reduce((s,m) => s + Number(m.valor),0);
  const expenses = movements.filter(m => m.tipo === "Despesa")
    .reduce((s,m) => s + Number(m.valor),0);
  $("income").textContent = money(income);
  $("expenses").textContent = money(expenses);
  $("balance").textContent = money(income-expenses);
  $("balance").className = (income-expenses < 0) ? "expense" : "income";

  const list = $("list");
  list.replaceChildren();
  if (!movements.length) {
    list.textContent = "Ainda não existem movimentos neste mês.";
    return;
  }
  movements.forEach(m => {
    const item = document.createElement("div");
    item.className = "item";
    const title = document.createElement("strong");
    title.textContent = m.descricao || m.categoria;
    const details = document.createElement("div");
    details.className = "small";
    details.textContent = `${m.data} · ${m.tipo} · ${m.categoria}`;
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px";
    const amount = document.createElement("strong");
    amount.className = m.tipo === "Despesa" ? "expense" : "income";
    amount.textContent = (m.tipo === "Despesa" ? "− " : "+ ") + money(m.valor);
    const del = document.createElement("button");
    del.textContent = "Apagar";
    del.style.cssText = "width:auto;margin:0;padding:8px;background:#fff0f0;color:#b94343";
    del.addEventListener("click", () => deleteMovement(m.id));
    row.append(amount,del);
    item.append(title,details,row);
    list.append(item);
  });
}

async function deleteMovement(id) {
  if (!confirm("Queres apagar este movimento?")) return;
  const {error} = await db.from("movimentos").delete().eq("id",id);
  if (error) {
    message("status", "Não foi possível apagar: " + error.message);
    return;
  }
  await loadMovements();
}

$("signin").addEventListener("click", () => signIn(false));
$("signup").addEventListener("click", () => signIn(true));
$("month").addEventListener("change", loadMovements);
$("refresh").addEventListener("click", loadMovements);

$("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  currentUser = null;
  movements = [];
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
});

$("movement-form").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return;
  const amount = Number($("amount").value);
  if (!Number.isFinite(amount) || amount <= 0) {
    message("status", "Introduz um valor superior a zero.");
    return;
  }
  $("save").disabled = true;
  const record = {
    user_id: currentUser.id,
    data: $("date").value,
    tipo: $("type").value,
    categoria: $("category").value,
    descricao: $("description").value.trim(),
    valor: Math.round(amount*100)/100
  };
  const {error} = await db.from("movimentos").insert(record);
  $("save").disabled = false;
  if (error) {
    message("status", "Não foi possível guardar: " + error.message);
    return;
  }
  $("movement-form").reset();
  $("date").value = today;
  await loadMovements();
});
init();
</script>
</body>
</html>
